<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{{ autor.nome }}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }

        .autor {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
        }

        h1 {
            margin-top: 0;
        }

        h2 {
            margin-top: 30px;
        }

        ul {
            padding-left: 20px;
        }

        li {
            margin-bottom: 8px;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .voltar {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="autor">

        <h1>{{ autor.nome }}</h1>

        <p>
            <strong>Nacionalidade:</strong>
            {{ autor.nacionalidade }}
        </p>

        <h2>Livros</h2>

        <ul>
            {% for livro in autor.livros.all %}
                <li>{{ livro.titulo }}</li>
            {% empty %}
                <li>Este autor não possui livros cadastrados.</li>
            {% endfor %}
        </ul>

        <a class="voltar" href="{% url 'listar_livros' %}">
            Voltar para livros
        </a>
    </div>
</body>
</html>
