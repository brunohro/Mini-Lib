<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar exclusão</title>
</head>
<body>
    <h2>Confirmar exclusão</h2>
    <p>Tem certeza de que deseja excluir o livro <strong>{{ livro.titulo }}</strong>?</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Confirmar exclusão</button>
    <a href="{% url 'listar_livros' %}">Cancelar</a>
</form>

</body>
</html>
